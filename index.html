<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AluraGeek</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <header class="main-header">
    <div class="logo-container">
      <img src="./assets/logo.png" alt="AluraGeek Logo" class="logo">
      <h1 class="site-title">AluraGeek</h1>
    </div>
  </header>

  <main>
    <section class="add-product">
      <h2>Agregar Producto:</h2>
      <form id="add-product-form">
        <input type="text" id="product-name" placeholder="Nombre..." required>
        <input type="number" id="product-price" placeholder="Precio..." required>
        <input type="url" id="product-image" placeholder="Imagen..." required>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
      </form>
    </section>

    <section class="products">
      <h1>Mis Productos:</h1>
      <div class="product-list"></div>
    </section>
  </main>

  <footer>
    <p>Desarrollado por MLVN - Alura LATAM - 2024</p>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
